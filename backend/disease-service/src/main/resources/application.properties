spring.application.name=disease-service
server.port=8084

spring.datasource.url=jdbc:postgresql://dsas-postgres:5432/dsas_diseases
spring.datasource.username=dsas_user
spring.datasource.password=dsas_password
spring.datasource.driver-class-name=org.postgresql.Driver

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect

eureka.client.service-url.defaultZone=http://eureka-server:8761/eureka/
eureka.instance.prefer-ip-address=true


#RabbitMQ configuration
spring.rabbitmq.host=localhost
spring.rabbitmq.port=5672
spring.rabbitmq.username=dsas_user
spring.rabbitmq.password=dsas_password
