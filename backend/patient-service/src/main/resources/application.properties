spring.application.name=patient-service
server.port=8082

# ?? PostgreSQL ????????????????????????????????????????????????????????????????
spring.datasource.url=jdbc:postgresql://dsas-postgres:5432/dsas_patients
spring.datasource.username=dsas_user
spring.datasource.password=dsas_password
spring.datasource.driver-class-name=org.postgresql.Driver

# ?? JPA ???????????????????????????????????????????????????????????????????????
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect

# ?? Eureka ????????????????????????????????????????????????????????????????????
eureka.client.service-url.defaultZone=http://eureka-server:8761/eureka/
eureka.instance.prefer-ip-address=true

#Rabbit MQ Setup
spring.rabbitmq.host=rabbitmq
spring.rabbitmq.port=5672
spring.rabbitmq.username=dsas_user
spring.rabbitmq.password=dsas_password

#Prometheus Config
management.endpoints.web.exposure.include=*
management.endpoint.health.show-details=always
management.prometheus.metrics.export.enabled=true
management.metrics.tags.application=${spring.application.name}
