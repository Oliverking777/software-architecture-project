spring.application.name=patient-service
server.port=8083

# ?? PostgreSQL ????????????????????????????????????????????????????????????????
spring.datasource.url=jdbc:postgresql://localhost:5432/dsas_patients
spring.datasource.username=dsas_user
spring.datasource.password=dsas_password
spring.datasource.driver-class-name=org.postgresql.Driver

# ?? JPA ???????????????????????????????????????????????????????????????????????
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect

# ?? Eureka ????????????????????????????????????????????????????????????????????
eureka.client.service-url.defaultZone=http://localhost:8761/eureka/
eureka.instance.prefer-ip-address=true

#Rabbit MQ Setup
spring.rabbitmq.host=localhost
spring.rabbitmq.port=5672
spring.rabbitmq.username=dsas_user
spring.rabbitmq.password=dsas_password
