---
# =============================================================
#  DSAS — Master Deployment Playbook
#  Targeted mode: skips vps-setup and manifest apply.
#  Only restarts and verifies the specified services.
# =============================================================

- name: DSAS - Deploy to Kubernetes
  hosts: vps
  become: true
  gather_facts: true

  vars_files:
    - vault/secrets.yml

  roles:
    - role: k8s-deploy
      tags: [deploy, k8s]