[vps]
dsas-vps ansible_host=76.13.43.14 ansible_user=root ansible_python_interpreter=/usr/bin/python3

[vps:vars]
# SSH private key Jenkins uses to connect
ansible_ssh_private_key_file=~/.ssh/id_rsa
# Disable host key checking on first connect (remove after first run)
ansible_ssh_common_args='-o StrictHostKeyChecking=no'