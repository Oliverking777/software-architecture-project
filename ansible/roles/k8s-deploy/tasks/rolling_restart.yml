---
# =============================================================
#  Rolling restart — forces pods to pull the new :latest image.
#  Only restarts APP deployments, not infra (postgres, etc.)
#  to avoid data disruption on every build.
# =============================================================

- name: Patch image tag on all app deployments (explicit tag)
  ansible.builtin.command:
    cmd: >
      k3s kubectl set image deployment/{{ item }}
      {{ item }}={{ dockerhub_username }}/{{ item }}:{{ image_tag }}
      --namespace={{ k8s_namespace }}
  loop: "{{ app_deployments }}"
  changed_when: true
  when: image_tag != 'latest'

- name: Rolling restart all app deployments (forces :latest pull)
  ansible.builtin.command:
    cmd: >
      k3s kubectl rollout restart deployment/{{ item }}
      --namespace={{ k8s_namespace }}
  loop: "{{ app_deployments }}"
  changed_when: true

- name: Wait for all app deployments to finish rolling out
  ansible.builtin.command:
    cmd: >
      k3s kubectl rollout status deployment/{{ item }}
      --namespace={{ k8s_namespace }}
      --timeout=180s
  loop: "{{ app_deployments }}"
  changed_when: false
  retries: 2
  delay: 15