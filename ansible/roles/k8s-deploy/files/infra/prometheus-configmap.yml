apiVersion: v1
kind: ConfigMap

metadata:
  name: prometheus-config

data:
  prometheus.yml: |
    global:
      scrape_interval: 15s

    scrape_configs:
      - job_name: 'prometheus'
        static_configs:
          - targets: ['localhost:9090']

      - job_name: 'spring-services'
        static_configs:
          - targets:
            - 'auth-service:8081'
            - 'patient-service:8082'
            - 'disease-service:8083'
            - 'location-service:8084'
            - 'api-gateway:8000'

      - job_name: 'python-services'
        static_configs:
          - targets:
            - 'analytics-service:8085'
            - 'report-service:8086'
            - 'notification-service:8087'
            - 'geo-service:8088'