apiVersion: apps/v1
kind: Deployment

metadata:
  name: disease-service

spec:
  replicas: 1

  selector:
    matchLabels:
      app: disease-service

  template:
    metadata:
      labels:
        app: disease-service

    spec:
      containers:
        - name: disease-service
          image: tinfeh/disease-service:latest
          imagePullPolicy: Always
          ports:
            - containerPort: 8083
          env:
            - name: EUREKA_CLIENT_SERVICEURL_DEFAULTZONE
              value: "http://eureka-server:8761/eureka/"
            - name: SPRING_DATASOURCE_URL
              value: "jdbc:postgresql://postgres:5432/dsas_patients"
            - name: SPRING_DATASOURCE_USERNAME
              value: "dsas_user"
            - name: SPRING_DATASOURCE_PASSWORD
              value: "dsas_password"
 