---
# =============================================================
#  OS prerequisites — packages and firewall rules
# =============================================================

- name: Update apt cache
  ansible.builtin.apt:
    update_cache: true
    cache_valid_time: 3600

- name: Install required packages
  ansible.builtin.apt:
    name:
      - curl
      - wget
      - git
      - ca-certificates
      - gnupg
      - lsb-release
      - apt-transport-https
      - python3-pip
      - python3-kubernetes   # for Ansible k8s module
      - ufw
    state: present

- name: Enable UFW and allow SSH
  community.general.ufw:
    rule: allow
    name: OpenSSH
    state: enabled

- name: Allow HTTP traffic
  community.general.ufw:
    rule: allow
    port: "80"
    proto: tcp

- name: Allow HTTPS traffic
  community.general.ufw:
    rule: allow
    port: "443"
    proto: tcp

- name: Allow k3s API server (internal access only)
  community.general.ufw:
    rule: allow
    port: "6443"
    proto: tcp
    src: "127.0.0.1"

- name: Disable swap (required for k3s/k8s)
  ansible.builtin.command: swapoff -a
  changed_when: false

- name: Ensure swap is disabled on reboot
  ansible.builtin.replace:
    path: /etc/fstab
    regexp: '^([^#].*\s+swap\s+.*)$'
    replace: '# \1'

- name: Set sysctl params for k8s networking
  ansible.posix.sysctl:
    name: "{{ item.name }}"
    value: "{{ item.value }}"
    state: present
    reload: true
  loop:
    - { name: "net.bridge.bridge-nf-call-iptables",  value: "1" }
    - { name: "net.bridge.bridge-nf-call-ip6tables", value: "1" }
    - { name: "net.ipv4.ip_forward",                 value: "1" }

- name: Load br_netfilter kernel module
  community.general.modprobe:
    name: br_netfilter
    state: present

- name: Persist br_netfilter on boot
  ansible.builtin.copy:
    content: "br_netfilter\n"
    dest: /etc/modules-load.d/br_netfilter.conf
    mode: "0644"