server {
    listen 80;
    server_name localhost;
    root /usr/share/nginx/html;
    index index.html;

    # React SPA routing
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Proxy Gateway (Java services)
    location /gateway/ {
        proxy_pass http://api-gateway:8080/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }

    # Proxy Analytics
    location /analytics/ {
        proxy_pass http://dsas-analytics:8085/;
        proxy_set_header Host $host;
    }

    # Proxy Reports
    location /reports/ {
        proxy_pass http://dsas-report:8086/;
        proxy_set_header Host $host;
    }

    # Proxy Notifications
    location /notifications/ {
        proxy_pass http://dsas-notification:8087/;
        proxy_set_header Host $host;
    }

    # Proxy Geo
    location /geo/ {
        proxy_pass http://dsas-geo:8088/;
        proxy_set_header Host $host;
    }
}
