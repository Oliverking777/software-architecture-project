apiVersion: apps/v1
kind: Deployment

metadata:
  name: report-service

spec:
  replicas: 1

  selector:
    matchLabels:
      app: report-service

  template:
    metadata:
      labels:
        app: report-service

    spec:
      containers:
        - name: report-service
          image: tinfeh/report-service:latest
          imagePullPolicy: Never
          ports:
            - containerPort: 8086
          env:
            - name: EUREKA_SERVER
              value: "http://eureka-server:8761/eureka"
            - name: RABBITMQ_URL
              value: "amqp://dsas_user:dsas_password@rabbitmq:5672/"