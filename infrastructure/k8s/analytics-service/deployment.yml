apiVersion: apps/v1
kind: Deployment

metadata:
  name: analytics-service

spec:
  replicas: 1

  selector:
    matchLabels:
      app: analytics-service

  template:
    metadata:
      labels:
        app: analytics-service

    spec:
      containers:
        - name: analytics-service
          image: tinfeh/analytics-service:latest
          imagePullPolicy: Never
          ports:
            - containerPort: 8085
          env:
            - name: EUREKA_SERVER
              value: "http://eureka-server:8761/eureka"
            - name: RABBITMQ_URL
              value: "amqp://dsas_user:dsas_password@rabbitmq:5672/"
            - name: DB_URL
              value: "postgresql+psycopg2://dsas_user:dsas_password@postgres:5432/dsas_analytics"