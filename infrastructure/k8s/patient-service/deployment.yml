apiVersion: apps/v1
kind: Deployment

metadata:
  name: patient-service

spec:
  replicas: 1

  selector:
    matchLabels:
      app: patient-service

  template:
    metadata:
      labels:
        app: patient-service

    spec:
      containers:
        - name: patient-service
          image: tinfeh/patient-service:latest
          imagePullPolicy: Always
          ports:
            - containerPort: 8082
          env:
            - name: EUREKA_CLIENT_SERVICEURL_DEFAULTZONE
              value: "http://eureka-server:8761/eureka/"
            - name: SPRING_DATASOURCE_URL
              value: "jdbc:postgresql://postgres:5432/dsas_patients"
            - name: SPRING_DATASOURCE_USERNAME
              value: "dsas_user"
            - name: SPRING_DATASOURCE_PASSWORD
              value: "dsas_password"
            - name: SPRING_RABBITMQ_HOST
              value: "rabbitmq"
            - name: SPRING_RABBITMQ_PORT
              value: "5672"
            - name: SPRING_RABBITMQ_USERNAME
              value: "dsas_user"
            - name: SPRING_RABBITMQ_PASSWORD
              value: "dsas_password"