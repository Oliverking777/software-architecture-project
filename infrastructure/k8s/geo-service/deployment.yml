apiVersion: apps/v1
kind: Deployment

metadata:
  name: geo-service

spec:
  replicas: 1

  selector:
    matchLabels:
      app: geo-service

  template:
    metadata:
      labels:
        app: geo-service

    spec:
      containers:
        - name: geo-service
          image: tinfeh/geo-service:latest
          imagePullPolicy: Always
          ports:
            - containerPort: 8088
          env:
            - name: EUREKA_SERVER
              value: "http://eureka-server:8761/eureka"
            - name: RABBITMQ_URL
              value: "amqp://dsas_user:dsas_password@rabbitmq:5672/"