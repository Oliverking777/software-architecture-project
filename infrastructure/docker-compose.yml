services:

  # ── Infrastructure ───────────────────────────────────────────
  postgres:
    image: postgres:15-alpine
    container_name: dsas-postgres
    environment:
      POSTGRES_USER: dsas_user
      POSTGRES_PASSWORD: dsas_password
      POSTGRES_DB: dsas_db
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      
    networks:
      - dsas-network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U dsas_user"]
      interval: 15s
      timeout: 5s
      retries: 10

  rabbitmq:
    image: rabbitmq:3.12-management-alpine
    container_name: dsas-rabbitmq
    environment:
      RABBITMQ_DEFAULT_USER: dsas_user
      RABBITMQ_DEFAULT_PASS: dsas_password
      RABBITMQ_ERLANG_COOKIE: "DSAS_STATIC_COOKIE_2024"
    ports:
      - "5672:5672"
      - "15672:15672"
    volumes:
      - rabbitmq_data:/var/lib/rabbitmq
    networks:
      - dsas-network
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "check_port_connectivity"]
      interval: 30s
      timeout: 30s
      retries: 10
      start_period: 60s

  mailhog:
    image: mailhog/mailhog:latest
    container_name: dsas-mailhog
    ports:
      - "1025:1025"
      - "8025:8025"
    networks:
      - dsas-network

  prometheus:
    image: prom/prometheus:latest
    container_name: dsas-prometheus
    ports:
      - "9090:9090"
    volumes:
      - ./prometheus.yml:/etc/prometheus/prometheus.yml
      - prometheus_data:/prometheus
    networks:
      - dsas-network
    restart: unless-stopped

  grafana:
    image: grafana/grafana:latest
    container_name: dsas-grafana
    ports:
      - "3000:3000"
    environment:
      GF_SECURITY_ADMIN_USER: dsas_user
      GF_SECURITY_ADMIN_PASSWORD: dsas_password
    volumes:
      - grafana_data:/var/lib/grafana
    depends_on:
      prometheus:
        condition: service_started
    networks:
      - dsas-network
    restart: unless-stopped

  # ── Services Python ──────────────────────────────────────────
  analytics-service:
    build: ../backend/analytics-service
    container_name: dsas-analytics
    ports:
      - "8085:8085"
    environment:
      EUREKA_SERVER: http://eureka-server:8761/eureka
      RABBITMQ_URL: amqp://dsas_user:dsas_password@rabbitmq:5672/
      DB_URL: postgresql+psycopg2://dsas_user:dsas_password@postgres:5432/dsas_analytics
    networks:
      - dsas-network
    depends_on:
      rabbitmq:
        condition: service_healthy
      postgres:
        condition: service_healthy
    restart: unless-stopped

  notification-service:
    build: ../backend/notification-service
    container_name: dsas-notification
    ports:
      - "8087:8087"
    environment:
      EUREKA_SERVER: http://eureka-server:8761/eureka
      RABBITMQ_URL: amqp://dsas_user:dsas_password@rabbitmq:5672/
      SMTP_HOST: mailhog
      SMTP_PORT: 1025
    networks:
      - dsas-network
    depends_on:
      rabbitmq:
        condition: service_healthy
    restart: unless-stopped

  report-service:
    build: ../backend/report-service
    container_name: dsas-report
    ports:
      - "8086:8086"
    environment:
      EUREKA_SERVER: http://eureka-server:8761/eureka
      RABBITMQ_URL: amqp://dsas_user:dsas_password@rabbitmq:5672/
    networks:
      - dsas-network
    depends_on:
      rabbitmq:
        condition: service_healthy
    restart: unless-stopped

  geo-service:
    build: ../backend/geo-service
    container_name: dsas-geo
    ports:
      - "8088:8088"
    environment:
      EUREKA_SERVER: http://eureka-server:8761/eureka
      RABBITMQ_URL: amqp://dsas_user:dsas_password@rabbitmq:5672/
    networks:
      - dsas-network
    depends_on:
      rabbitmq:
        condition: service_healthy
    restart: unless-stopped

  # ── Services Java ────────────────────────────────────────────
  eureka-server:
    build:
      context: ../backend/discovery-service
      dockerfile: Dockerfile
    container_name: eureka-server
    ports:
      - "8761:8761"
    dns:
      - 8.8.8.8
      - 8.8.4.4
    networks:
      - dsas-network
    restart: unless-stopped

  api-gateway:
    build:
      context: ../backend/api-gateway
      dockerfile: Dockerfile
    container_name: api-gateway
    ports:
      - "8000:8000"
    depends_on:
      eureka-server:
        condition: service_started
    dns:
      - 8.8.8.8
      - 8.8.4.4
    networks:
      - dsas-network
    restart: unless-stopped

  auth-service:
    build:
      context: ../backend/auth-service
      dockerfile: Dockerfile
    container_name: auth-service
    ports:
      - "8081:8081"
    depends_on:
      postgres:
        condition: service_healthy
      eureka-server:
        condition: service_started
    dns:
      - 8.8.8.8
      - 8.8.4.4
    networks:
      - dsas-network
    restart: unless-stopped

  disease-service:
    build:
      context: ../backend/disease-service
      dockerfile: Dockerfile
    container_name: disease-service
    ports:
      - "8083:8083"
    depends_on:
      postgres:
        condition: service_healthy
      eureka-server:
        condition: service_started
    dns:
      - 8.8.8.8
      - 8.8.4.4
    networks:
      - dsas-network
    restart: unless-stopped

  location-service:
    build:
      context: ../backend/location-service
      dockerfile: Dockerfile
    container_name: location-service
    ports:
      - "8084:8084"
    depends_on:
      postgres:
        condition: service_healthy
      eureka-server:
        condition: service_started
    dns:
      - 8.8.8.8
      - 8.8.4.4
    networks:
      - dsas-network
    restart: unless-stopped

  patient-service:
    build:
      context: ../backend/patient-service
      dockerfile: Dockerfile
    container_name: patient-service
    ports:
      - "8082:8082"
    depends_on:
      postgres:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
      eureka-server:
        condition: service_started
    dns:
      - 8.8.8.8
      - 8.8.4.4
    networks:
      - dsas-network
    restart: unless-stopped

  # ── Frontend ─────────────────────────────────────────────────
  frontend:
    build:
      context: ../frontend/react-app
      dockerfile: Dockerfile
    container_name: dsas-frontend
    ports:
      - "3001:80"
    depends_on:
      - api-gateway
      - analytics-service
      - report-service
      - notification-service
      - geo-service
    networks:
      - dsas-network
    restart: unless-stopped

volumes:
  postgres_data:
  rabbitmq_data:
  prometheus_data:
  grafana_data:

networks:
  dsas-network:
    driver: bridge