name: Backend Java CI/CD

on:
  push:
    branches: [ main, develop ]
    paths:
      - 'backend/api-gateway/**'
      - 'backend/auth-service/**'
      - 'backend/discovery-service/**'
      - 'backend/disease-service/**'
      - 'backend/location-service/**'
      - 'backend/patient-service/**'
      - '.github/workflows/backend-java.yml'
  pull_request:
    branches: [ main, develop ]
    paths:
      - 'backend/api-gateway/**'
      - 'backend/auth-service/**'
      - 'backend/discovery-service/**'
      - 'backend/disease-service/**'
      - 'backend/location-service/**'
      - 'backend/patient-service/**'
      - '.github/workflows/backend-java.yml'

env:
  REGISTRY: docker.io
  JAVA_VERSION: '17'
  MAVEN_VERSION: '3.9.6'

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:15-alpine
        env:
          POSTGRES_USER: dsas_user
          POSTGRES_PASSWORD: dsas_password
          POSTGRES_DB: dsas_db
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

      rabbitmq:
        image: rabbitmq:3.12-alpine
        env:
          RABBITMQ_DEFAULT_USER: dsas_user
          RABBITMQ_DEFAULT_PASS: dsas_password
        ports:
          - 5672:5672
        options: >-
          --health-cmd "rabbitmq-diagnostics ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    strategy:
      matrix:
        service:
          - api-gateway
          - auth-service
          - discovery-service
          - disease-service
          - location-service
          - patient-service

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: ${{ env.JAVA_VERSION }}
          distribution: 'temurin'
          cache: maven

      - name: Build ${{ matrix.service }} with Maven
        run: |
          cd backend/${{ matrix.service }}
          mvn clean package -DskipTests -B

      - name: Run tests for ${{ matrix.service }}
        env:
          SPRING_DATASOURCE_URL: jdbc:postgresql://localhost:5432/dsas_db
          SPRING_DATASOURCE_USERNAME: dsas_user
          SPRING_DATASOURCE_PASSWORD: dsas_password
          SPRING_RABBITMQ_HOST: localhost
          SPRING_RABBITMQ_PORT: 5672
          SPRING_RABBITMQ_USERNAME: dsas_user
          SPRING_RABBITMQ_PASSWORD: dsas_password
        run: |
          cd backend/${{ matrix.service }}
          mvn test -B -Dspring.profiles.active=test

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-results-${{ matrix.service }}
          path: backend/${{ matrix.service }}/target/surefire-reports/
          retention-days: 30

  build-images:
    needs: build-and-test
    runs-on: ubuntu-latest
    if: github.event_name == 'push' && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/develop')

    strategy:
      matrix:
        service:
          - api-gateway
          - auth-service
          - discovery-service
          - disease-service
          - location-service
          - patient-service

    permissions:
      contents: read
      packages: write

    steps:
      - uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to Docker Hub
        if: github.actor != 'dependabot[bot]'
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Build and push ${{ matrix.service }} image
        uses: docker/build-push-action@v5
        with:
          context: backend/${{ matrix.service }}
          push: ${{ github.actor != 'dependabot[bot]' }}
          tags: |
            ${{ secrets.DOCKER_USERNAME }}/${{ matrix.service }}:latest
            ${{ secrets.DOCKER_USERNAME }}/${{ matrix.service }}:${{ github.sha }}
          cache-from: type=registry,ref=${{ secrets.DOCKER_USERNAME }}/${{ matrix.service }}:buildcache
          cache-to: type=registry,ref=${{ secrets.DOCKER_USERNAME }}/${{ matrix.service }}:buildcache,mode=max

  security-scan:
    needs: build-and-test
    runs-on: ubuntu-latest

    strategy:
      matrix:
        service:
          - api-gateway
          - auth-service
          - discovery-service
          - disease-service
          - location-service
          - patient-service

    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: ${{ env.JAVA_VERSION }}
          distribution: 'temurin'
          cache: maven

      - name: Build ${{ matrix.service }} for analysis
        run: |
          cd backend/${{ matrix.service }}
          mvn clean package -DskipTests -B

      - name: Run security analysis on ${{ matrix.service }}
        run: |
          cd backend/${{ matrix.service }}
          mvn dependency-check:check -B || true

      - name: SonarQube Scan
        if: always()
        uses: SonarSource/sonarqube-scan-action@v5
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
          SONAR_HOST_URL: https://sonarcloud.io
        with:
          args: >
            -Dsonar.projectKey=disease-surveillance-backend-${{ matrix.service }}
            -Dsonar.organization=${{ secrets.SONAR_ORGANIZATION }}
            -Dsonar.sources=backend/${{ matrix.service }}/src/main/java
            -Dsonar.java.binaries=backend/${{ matrix.service }}/target/classes
            -Dsonar.tests=backend/${{ matrix.service }}/src/test/java
            -Dsonar.java.test.binaries=backend/${{ matrix.service }}/target/test-classes

  deploy:
    needs: [ build-images ]
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main'

    steps:
      - uses: actions/checkout@v4

      - name: Copy k8s manifests to VPS
        uses: appleboy/scp-action@v0.1.4
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          source: "infrastructure/k8s/"
          target: "/home/deploy/"

      - name: Deploy Java services to VPS
        uses: appleboy/ssh-action@v1.0.0
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          script: |
            # Apply manifests for all services (including discovery to keep config up to date)
            kubectl apply -f /home/deploy/infrastructure/k8s/discovery-service/
            kubectl apply -f /home/deploy/infrastructure/k8s/api-gateway/
            kubectl apply -f /home/deploy/infrastructure/k8s/auth-service/
            kubectl apply -f /home/deploy/infrastructure/k8s/disease-service/
            kubectl apply -f /home/deploy/infrastructure/k8s/location-service/
            kubectl apply -f /home/deploy/infrastructure/k8s/patient-service/

            # Skip restarting discovery-service if already running healthy
            READY=$(kubectl get deployment discovery-service \
              -o jsonpath='{.status.readyReplicas}' 2>/dev/null || echo "0")
            if [ "$READY" = "0" ]; then
              echo "Discovery service not ready — restarting..."
              kubectl rollout restart deployment/discovery-service
              kubectl rollout status deployment/discovery-service --timeout=300s
            else
              echo "Discovery service already running ($READY replicas) — skipping restart"
            fi

            # Restart all other Java services
            kubectl rollout restart deployment/api-gateway
            kubectl rollout restart deployment/auth-service
            # kubectl rollout restart deployment/disease-service
            # kubectl rollout restart deployment/location-service
            # kubectl rollout restart deployment/patient-service

            # Wait for rollouts to complete
            kubectl rollout status deployment/api-gateway --timeout=300s
            kubectl rollout status deployment/auth-service --timeout=300s
            # kubectl rollout status deployment/disease-service --timeout=300s
            # kubectl rollout status deployment/location-service --timeout=300s
            # kubectl rollout status deployment/patient-service --timeout=300s