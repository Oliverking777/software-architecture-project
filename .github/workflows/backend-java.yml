jobs:
  build-and-test:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:15-alpine
        env:
          POSTGRES_USER: dsas_user
          POSTGRES_PASSWORD: dsas_password
          POSTGRES_DB: dsas_patients
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

      rabbitmq:
        image: rabbitmq:3.12-alpine
        env:
          RABBITMQ_DEFAULT_USER: dsas_user
          RABBITMQ_DEFAULT_PASS: dsas_password
        ports:
          - 5672:5672
        options: >-
          --health-cmd "rabbitmq-diagnostics ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    strategy:
      matrix:
        service:
          - api-gateway
          - auth-service
          - discovery-service
          - disease-service
          - location-service
          - patient-service

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: ${{ env.JAVA_VERSION }}
          distribution: 'temurin'
          cache: maven

      - name: Build ${{ matrix.service }} with Maven
        run: |
          cd backend/${{ matrix.service }}
          mvn clean package -DskipTests -B

      - name: Run tests for ${{ matrix.service }}
        run: |
          cd backend/${{ matrix.service }}
          mvn test -B
        env:
          SPRING_DATASOURCE_URL: jdbc:postgresql://localhost:5432/dsas_patients
          SPRING_DATASOURCE_USERNAME: dsas_user
          SPRING_DATASOURCE_PASSWORD: dsas_password
          SPRING_RABBITMQ_HOST: localhost
          SPRING_RABBITMQ_PORT: 5672
          SPRING_RABBITMQ_USERNAME: dsas_user
          SPRING_RABBITMQ_PASSWORD: dsas_password
          EUREKA_CLIENT_ENABLED: false
          SPRING_CLOUD_DISCOVERY_ENABLED: false