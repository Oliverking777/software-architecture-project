name: Backend Java CI/CD

on:
  push:
    branches: [ main, develop ]
    paths:
      - 'backend/api-gateway/**'
      - 'backend/auth-service/**'
      - 'backend/discovery-service/**'
      - 'backend/disease-service/**'
      - 'backend/location-service/**'
      - 'backend/patient-service/**'
      - '.github/workflows/backend-java.yml'
  pull_request:
    branches: [ main, develop ]
    paths:
      - 'backend/api-gateway/**'
      - 'backend/auth-service/**'
      - 'backend/discovery-service/**'
      - 'backend/disease-service/**'
      - 'backend/location-service/**'
      - 'backend/patient-service/**'
      - '.github/workflows/backend-java.yml'

env:
  REGISTRY: docker.io
  JAVA_VERSION: '17'
  MAVEN_VERSION: '3.9.6'

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    
    strategy:
      matrix:
        service:
          - api-gateway
          - auth-service
          - discovery-service
          - disease-service
          - location-service
          - patient-service

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: ${{ env.JAVA_VERSION }}
          distribution: 'temurin'
          cache: maven

      - name: Build ${{ matrix.service }} with Maven
        run: |
          cd backend/${{ matrix.service }}
          mvn clean package -DskipTests -B

      - name: Run tests for ${{ matrix.service }}
        run: |
          cd backend/${{ matrix.service }}
          mvn test -B

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-results-${{ matrix.service }}
          path: backend/${{ matrix.service }}/target/surefire-reports/
          retention-days: 30

  build-images:
    needs: build-and-test
    runs-on: ubuntu-latest
    if: github.event_name == 'push' && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/develop')

    strategy:
      matrix:
        service:
          - api-gateway
          - auth-service
          - discovery-service
          - disease-service
          - location-service
          - patient-service

    permissions:
      contents: read
      packages: write

    steps:
      - uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to Docker Hub
        if: github.actor != 'dependabot[bot]'
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Build and push ${{ matrix.service }} image
        uses: docker/build-push-action@v5
        with:
          context: backend/${{ matrix.service }}
          push: ${{ github.actor != 'dependabot[bot]' }}
          tags: |
            ${{ secrets.DOCKER_USERNAME }}/${{ matrix.service }}:latest
            ${{ secrets.DOCKER_USERNAME }}/${{ matrix.service }}:${{ github.sha }}
          cache-from: type=registry,ref=${{ secrets.DOCKER_USERNAME }}/${{ matrix.service }}:buildcache
          cache-to: type=registry,ref=${{ secrets.DOCKER_USERNAME }}/${{ matrix.service }}:buildcache,mode=max

  security-scan:
    needs: build-and-test
    runs-on: ubuntu-latest
    
    strategy:
      matrix:
        service:
          - api-gateway
          - auth-service
          - discovery-service
          - disease-service
          - location-service
          - patient-service

    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: ${{ env.JAVA_VERSION }}
          distribution: 'temurin'
          cache: maven

      - name: Run security analysis on ${{ matrix.service }}
        run: |
          cd backend/${{ matrix.service }}
          mvn dependency-check:check -B || true

      - name: SonarQube Scan
        uses: SonarSource/sonarcloud-github-action@master
        if: always()
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
        with:
          args: >
            -Dsonar.projectKey=disease-surveillance-backend-${{ matrix.service }}
            -Dsonar.sources=backend/${{ matrix.service }}/src
