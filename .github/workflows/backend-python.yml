name: Backend Python CI/CD

on:
  push:
    branches: [ main, develop ]
    paths:
      - 'backend/analytics-service/**'
      - 'backend/geo-service/**'
      - 'backend/notification-service/**'
      - 'backend/report-service/**'
      - '.github/workflows/backend-python.yml'
  pull_request:
    branches: [ main, develop ]
    paths:
      - 'backend/analytics-service/**'
      - 'backend/geo-service/**'
      - 'backend/notification-service/**'
      - 'backend/report-service/**'
      - '.github/workflows/backend-python.yml'

env:
  REGISTRY: docker.io
  PYTHON_VERSION: '3.11'

jobs:
  lint-and-test:
    runs-on: ubuntu-latest
    
    strategy:
      matrix:
        service:
          - analytics-service
          - geo-service
          - notification-service
          - report-service

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python ${{ env.PYTHON_VERSION }}
        uses: actions/setup-python@v4
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: 'pip'

      - name: Install dependencies for ${{ matrix.service }}
        run: |
          cd backend/${{ matrix.service }}
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pytest pytest-cov flake8 black isort

      - name: Lint with flake8 - ${{ matrix.service }}
        run: |
          cd backend/${{ matrix.service }}
          flake8 app --count --select=E9,F63,F7,F82 --show-source --statistics
          flake8 app --count --exit-zero --max-complexity=10 --max-line-length=127 --statistics || true

      - name: Check code format with black - ${{ matrix.service }}
        run: |
          cd backend/${{ matrix.service }}
          black --check app || true

      - name: Check import sorting with isort - ${{ matrix.service }}
        run: |
          cd backend/${{ matrix.service }}
          isort --check-only app || true

      - name: Run tests for ${{ matrix.service }}
        run: |
          cd backend/${{ matrix.service }}
          pytest --cov=app --cov-report=xml --cov-report=html || true

      - name: Upload test coverage
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: coverage-reports-${{ matrix.service }}
          path: backend/${{ matrix.service }}/htmlcov/
          retention-days: 30

      - name: Upload coverage to Codecov
        if: always()
        uses: codecov/codecov-action@v3
        with:
          files: ./backend/${{ matrix.service }}/coverage.xml
          flags: ${{ matrix.service }}
          fail_ci_if_error: false

  security-scan:
    runs-on: ubuntu-latest
    
    strategy:
      matrix:
        service:
          - analytics-service
          - geo-service
          - notification-service
          - report-service

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ env.PYTHON_VERSION }}
        uses: actions/setup-python@v4
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: 'pip'

      - name: Install security tools for ${{ matrix.service }}
        run: |
          python -m pip install --upgrade pip
          pip install bandit safety

      - name: Run Bandit security scan - ${{ matrix.service }}
        run: |
          cd backend/${{ matrix.service }}
          bandit -r app -f json -o bandit-report.json || true
          bandit -r app || true

      - name: Check dependencies for vulnerabilities - ${{ matrix.service }}
        run: |
          cd backend/${{ matrix.service }}
          safety check -r requirements.txt --json || true

      - name: Upload security reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: security-reports-${{ matrix.service }}
          path: backend/${{ matrix.service }}/bandit-report.json
          retention-days: 30

  build-images:
    needs: [lint-and-test, security-scan]
    runs-on: ubuntu-latest
    if: github.event_name == 'push' && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/develop')

    strategy:
      matrix:
        service:
          - analytics-service
          - geo-service
          - notification-service
          - report-service

    permissions:
      contents: read
      packages: write

    steps:
      - uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to Docker Hub
        if: github.actor != 'dependabot[bot]'
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Build and push ${{ matrix.service }} image
        uses: docker/build-push-action@v5
        with:
          context: backend/${{ matrix.service }}
          push: ${{ github.actor != 'dependabot[bot]' }}
          tags: |
            ${{ secrets.DOCKER_USERNAME }}/${{ matrix.service }}:latest
            ${{ secrets.DOCKER_USERNAME }}/${{ matrix.service }}:${{ github.sha }}
          cache-from: type=registry,ref=${{ secrets.DOCKER_USERNAME }}/${{ matrix.service }}:buildcache
          cache-to: type=registry,ref=${{ secrets.DOCKER_USERNAME }}/${{ matrix.service }}:buildcache,mode=max

  deploy:
    needs: [build-images]
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main'

    steps:
      - uses: actions/checkout@v4

      - name: Copy k8s manifests to VPS
        uses: appleboy/scp-action@v0.1.4
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          source: "infrastructure/k8s/"
          target: "/home/deploy/"

      - name: Deploy Python services to VPS
        uses: appleboy/ssh-action@v1.0.0
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          script: |
            # Apply all k8s manifests
            kubectl apply -f /home/deploy/infrastructure/k8s/analytics-service/
            kubectl apply -f /home/deploy/infrastructure/k8s/geo-service/
            kubectl apply -f /home/deploy/infrastructure/k8s/notification-service/
            kubectl apply -f /home/deploy/infrastructure/k8s/report-service/

            # Restart to pull latest images from Docker Hub
            kubectl rollout restart deployment/analytics-service
            kubectl rollout restart deployment/geo-service
            kubectl rollout restart deployment/notification-service
            kubectl rollout restart deployment/report-service

            # Wait for rollouts to complete
            kubectl rollout status deployment/analytics-service --timeout=300s
            kubectl rollout status deployment/geo-service --timeout=300s
            kubectl rollout status deployment/notification-service --timeout=300s
            kubectl rollout status deployment/report-service --timeout=300s

  notify:
    needs: [deploy]
    runs-on: ubuntu-latest
    if: always()

    steps:
      - name: Notify build status
        run: |
          echo "Backend Python CI/CD pipeline completed"
          echo "Status: ${{ needs.deploy.result }}"
