name: Infrastructure CI/CD

on:
  push:
    branches: [ main, develop ]
    paths:
      - 'infrastructure/k8s/postgres/**'
      - 'infrastructure/k8s/rabbitmq/**'
      - 'infrastructure/k8s/prometheus/**'
      - 'infrastructure/k8s/grafana/**'
      - 'infrastructure/k8s/mailhog/**'
      - 'infrastructure/init-db.sql'
      - 'infrastructure/prometheus.yml'
      - '.github/workflows/infrastructure.yml'
  pull_request:
    branches: [ main, develop ]
    paths:
      - 'infrastructure/k8s/postgres/**'
      - 'infrastructure/k8s/rabbitmq/**'
      - 'infrastructure/k8s/prometheus/**'
      - 'infrastructure/k8s/grafana/**'
      - 'infrastructure/k8s/mailhog/**'
      - 'infrastructure/init-db.sql'
      - 'infrastructure/prometheus.yml'
      - '.github/workflows/infrastructure.yml'

jobs:
  deploy-infrastructure:
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main'

    steps:
      - uses: actions/checkout@v4

      - name: Copy infrastructure manifests to VPS
        uses: appleboy/scp-action@v0.1.4
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          source: "infrastructure/k8s/, infrastructure/init-db.sql"
          target: "/home/deploy/"

      - name: Deploy infrastructure to VPS
        uses: appleboy/ssh-action@v1.0.0
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          script: |
            kubectl create configmap postgres-init-sql \
              --from-file=init.sql=/home/deploy/infrastructure/init-db.sql \
              --dry-run=client -o yaml | kubectl apply -f -

            kubectl apply -f /home/deploy/infrastructure/k8s/postgres/
            kubectl apply -f /home/deploy/infrastructure/k8s/rabbitmq/
            kubectl apply -f /home/deploy/infrastructure/k8s/mailhog/
            kubectl apply -f /home/deploy/infrastructure/k8s/prometheus/
            kubectl apply -f /home/deploy/infrastructure/k8s/grafana/

            kubectl rollout status deployment/postgres --timeout=300s
            kubectl rollout status deployment/rabbitmq --timeout=300s
            kubectl rollout status deployment/mailhog --timeout=300s
            kubectl rollout status deployment/prometheus --timeout=300s
            kubectl rollout status deployment/grafana --timeout=300s

            echo "Infrastructure deployed successfully"